    <circle cx="229" cy="722" r="19" fill="#e5d58d" stroke="#315861" stroke-width="6"/>
    <circle cx="230" cy="723" r="10.5" fill="url(#eye)"/>
    <circle cx="226" cy="718" r="3.8" fill="#fff"/>
    <path d="M184 764c12 6 24 6 36 0" fill="none" stroke="#315861" stroke-linecap="round" stroke-width="6"/>
    <path d="M422 849c30 33 64 41 99 24-21-15-34-36-40-62-19 19-39 32-59 38z" fill="url(#fin)" stroke="#4a5262" stroke-linejoin="round" stroke-width="7"/>
    <path d="M383 850c14 44 31 73 52 88" fill="none" stroke="#4a5262" stroke-linecap="round" stroke-width="7"/>
  </g>
