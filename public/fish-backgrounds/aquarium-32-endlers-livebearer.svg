      <path d="M656 675c5 35 21 63 49 84 24 18 39 43 45 74" stroke="#243f4c" stroke-width="17"/>
      <path d="M623 683c26 25 60 38 102 39m-119 58c38-5 72 3 101 24" stroke="#65c2a1" stroke-width="12"/>
    </g>
    <path d="M414 667c31-61 76-84 132-69-21 25-24 53-11 84-40-12-80-17-121-15z" fill="url(#fin)" stroke="#4a5262" stroke-linejoin="round" stroke-width="8"/>
    <path d="M194 737c33-58 110-86 207-72 82 12 149 47 199 101-47 54-116 84-206 86-93 2-167-23-207-69-13-15-11-31 7-46z" fill="url(#body)" stroke="#315861" stroke-linejoin="round" stroke-width="9"/>
