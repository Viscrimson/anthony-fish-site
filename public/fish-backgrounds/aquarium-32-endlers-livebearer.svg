      <path d="M511 690c-3 23 8 40 33 52 18 9 29 24 32 45" fill="none" stroke="#d9e16f" stroke-linecap="round" stroke-width="22"/>
      <path d="M207 739c59 13 116 5 171-24 55-29 112-28 171 4m-349 70c62 15 121 8 177-22 59-31 117-27 176 14" fill="none" stroke="#d9f0b5" stroke-linecap="round" stroke-width="8"/>
      <g fill="#172e38" stroke="#f1cf58" stroke-width="4">
        <circle cx="287" cy="715" r="11"/><circle cx="372" cy="792" r="13"/><circle cx="518" cy="721" r="10"/>
      </g>
    </g>
    <path d="M270 739c27-28 60-29 96-3-15 43-48 65-91 55-14-15-16-33-5-52z" fill="#94d4a8" stroke="#315861" stroke-linejoin="round" stroke-width="7"/>
