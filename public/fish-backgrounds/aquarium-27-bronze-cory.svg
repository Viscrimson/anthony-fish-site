        <circle cx="503" cy="715" r="9"/><circle cx="574" cy="739" r="9"/><circle cx="634" cy="771" r="9"/>
      </g>
    </g>
    <path d="M185 722c17-30 43-50 79-62" fill="none" stroke="#d78e65" stroke-linecap="round" stroke-width="20"/>
