    <use href="#bubble-mark" opacity=".65" transform="matrix(.23 0 0 .23 142 1048)"/>
    <use href="#bubble-mark" opacity=".8" transform="matrix(.34 0 0 .34 93 912)"/>
    <use href="#bubble-mark" opacity=".59" transform="matrix(.18 0 0 .18 154 776)"/>
    <use href="#bubble-mark" opacity=".73" transform="matrix(.27 0 0 .27 113 649)"/>
    <use href="#bubble-mark" opacity=".85" transform="matrix(.38 0 0 .38 711 928)"/>
    <use href="#bubble-mark" opacity=".64" transform="matrix(.22 0 0 .22 763 780)"/>
    <use href="#bubble-mark" opacity=".78" transform="matrix(.31 0 0 .31 721 641)"/>
    <use href="#bubble-mark" opacity=".58" transform="matrix(.18 0 0 .18 778 502)"/>
    <use href="#bubble-mark" opacity=".71" transform="matrix(.26 0 0 .26 738 376)"/>
