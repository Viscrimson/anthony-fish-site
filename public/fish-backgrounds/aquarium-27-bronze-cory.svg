<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" viewBox="0 0 900 1600">
  <title>Bronze cory and bubbles aquarium background</title>
  <desc>A transparent vector aquarium layer showing one bronze cory with a high armored body, metallic green-bronze flank, clear barbels, crisp dark outlines, and rising bubbles.</desc>
  <defs>
    <linearGradient id="cory-body" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#dfd8a6"/>
      <stop offset=".3" stop-color="#b9b77d"/>
      <stop offset=".58" stop-color="#66877b"/>
      <stop offset=".82" stop-color="#536c65"/>
      <stop offset="1" stop-color="#36545a"/>
    </linearGradient>
    <linearGradient id="cory-belly" x1="0" x2="1">
      <stop stop-color="#eadca9"/>
      <stop offset="1" stop-color="#b7b47f"/>
    </linearGradient>
    <linearGradient id="cory-fin" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#d8d39b"/>
      <stop offset=".55" stop-color="#a9ad79"/>
      <stop offset="1" stop-color="#6e8372"/>
    </linearGradient>
    <radialGradient id="eye" cx="35%" cy="28%" r="70%">
      <stop stop-color="#627972"/>
      <stop offset=".55" stop-color="#273d3e"/>
      <stop offset="1" stop-color="#13282c"/>
    </radialGradient>
    <radialGradient id="bubble" cx="35%" cy="28%" r="70%">
      <stop stop-color="#fff" stop-opacity=".94"/>
      <stop offset=".28" stop-color="#c7efeb" stop-opacity=".6"/>
      <stop offset="1" stop-color="#69aaa9" stop-opacity=".14"/>
    </radialGradient>
    <clipPath id="body-clip">
      <path d="M171 770c36-127 156-204 318-176 101 17 176 77 222 174-38 105-126 169-260 179-129 9-235-25-295-102-15-19-9-50 15-75z"/>
    </clipPath>
    <g id="bubble-mark">
      <circle cx="50" cy="50" r="38" fill="url(#bubble)" stroke="#6eaaa8" stroke-opacity=".72" stroke-width="6"/>
      <path d="M29 43c3-10 10-17 20-20" fill="none" stroke="#fff" stroke-linecap="round" stroke-opacity=".82" stroke-width="7"/>
    </g>
  </defs>
  <g aria-label="bubbles">
    <use href="#bubble-mark" opacity=".87" transform="matrix(.42 0 0 .42 94 1182)"/>
    <use href="#bubble-mark" opacity=".66" transform="matrix(.24 0 0 .24 151 1046)"/>
    <use href="#bubble-mark" opacity=".8" transform="matrix(.34 0 0 .34 107 912)"/>
    <use href="#bubble-mark" opacity=".6" transform="matrix(.18 0 0 .18 166 780)"/>
    <use href="#bubble-mark" opacity=".73" transform="matrix(.27 0 0 .27 127 655)"/>
    <use href="#bubble-mark" opacity=".85" transform="matrix(.38 0 0 .38 710 848)"/>
    <use href="#bubble-mark" opacity=".65" transform="matrix(.22 0 0 .22 761 704)"/>
    <use href="#bubble-mark" opacity=".78" transform="matrix(.31 0 0 .31 722 570)"/>
    <use href="#bubble-mark" opacity=".58" transform="matrix(.18 0 0 .18 777 435)"/>
    <use href="#bubble-mark" opacity=".71" transform="matrix(.26 0 0 .26 739 312)"/>
  </g>
  <g aria-label="bronze cory">
    <path d="M690 750c65-68 127-82 187-45-39 25-62 58-70 99 12 41 36 72 73 94-60 38-123 24-190-42 18-34 18-70 0-106z" fill="url(#cory-fin)" stroke="#405b58" stroke-linejoin="round" stroke-width="9"/>
