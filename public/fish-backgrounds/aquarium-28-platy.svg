<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" viewBox="0 0 900 1600">
  <title>Platy and bubbles aquarium background</title>
  <desc>A transparent vector aquarium layer showing one coral-red platy with a short deep body, rounded fan tail, crisp dark outlines, and rising bubbles.</desc>
  <defs>
    <linearGradient id="body" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f5c06d"/>
      <stop offset=".42" stop-color="#ed8c61"/>
      <stop offset=".76" stop-color="#d96062"/>
      <stop offset="1" stop-color="#a84e61"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f5cc76"/>
      <stop offset=".52" stop-color="#e47b61"/>
      <stop offset="1" stop-color="#8f5064"/>
    </linearGradient>
    <radialGradient id="eye" cx="35%" cy="28%" r="70%">
      <stop stop-color="#647b76"/>
      <stop offset=".55" stop-color="#263e42"/>
      <stop offset="1" stop-color="#13282e"/>
    </radialGradient>
    <radialGradient id="bubble" cx="35%" cy="28%" r="70%">
      <stop stop-color="#fff" stop-opacity=".94"/>
      <stop offset=".28" stop-color="#c7efeb" stop-opacity=".6"/>
      <stop offset="1" stop-color="#69aaa9" stop-opacity=".14"/>
    </radialGradient>
    <clipPath id="body-clip">
      <path d="M159 720c34-93 136-139 265-119 111 17 194 69 243 148-48 82-138 125-257 127-124 2-220-38-264-107-12-19-7-35 13-49z"/>
    </clipPath>
    <clipPath id="tail-clip">
      <path d="M638 686c76-57 148-66 214-28-31 51-34 105-8 162-62 44-132 35-211-20 27-37 29-75 5-114z"/>
    </clipPath>
    <g id="bubble-mark">
      <circle cx="50" cy="50" r="38" fill="url(#bubble)" stroke="#6eaaa8" stroke-opacity=".72" stroke-width="6"/>
      <path d="M29 43c3-10 10-17 20-20" fill="none" stroke="#fff" stroke-linecap="round" stroke-opacity=".82" stroke-width="7"/>
    </g>
  </defs>
  <g aria-label="bubbles">
    <use href="#bubble-mark" opacity=".87" transform="matrix(.42 0 0 .42 91 1177)"/>
    <use href="#bubble-mark" opacity=".64" transform="matrix(.23 0 0 .23 151 1036)"/>
    <use href="#bubble-mark" opacity=".79" transform="matrix(.34 0 0 .34 103 903)"/>
    <use href="#bubble-mark" opacity=".59" transform="matrix(.18 0 0 .18 168 769)"/>
    <use href="#bubble-mark" opacity=".73" transform="matrix(.27 0 0 .27 126 643)"/>
    <use href="#bubble-mark" opacity=".84" transform="matrix(.37 0 0 .37 714 912)"/>
    <use href="#bubble-mark" opacity=".64" transform="matrix(.22 0 0 .22 762 765)"/>
    <use href="#bubble-mark" opacity=".77" transform="matrix(.31 0 0 .31 726 627)"/>
    <use href="#bubble-mark" opacity=".58" transform="matrix(.18 0 0 .18 779 489)"/>
    <use href="#bubble-mark" opacity=".7" transform="matrix(.26 0 0 .26 741 363)"/>
  </g>
  <g aria-label="platy">
    <path d="M638 686c76-57 148-66 214-28-31 51-34 105-8 162-62 44-132 35-211-20 27-37 29-75 5-114z" fill="url(#fin)" stroke="#594d5d" stroke-linejoin="round" stroke-width="10"/>
    <g clip-path="url(#tail-clip)" fill="none" stroke-linecap="round">
      <path d="M655 700c61-24 120-31 178-22m-185 69c65-10 127-5 184 16m-173 28c55 13 103 34 145 62" stroke="#f7d188" stroke-width="10"/>
      <path d="M719 655c-4 37 9 68 39 94 25 22 39 52 42 90" stroke="#a34f61" stroke-width="17"/>
    </g>
    <path d="M380 610c27-69 74-104 133-96-21 33-23 70-6 111-43-14-85-19-127-15z" fill="url(#fin)" stroke="#594d5d" stroke-linejoin="round" stroke-width="9"/>
    <path d="M159 720c34-93 136-139 265-119 111 17 194 69 243 148-48 82-138 125-257 127-124 2-220-38-264-107-12-19-7-35 13-49z" fill="url(#body)" stroke="#594d5d" stroke-linejoin="round" stroke-width="10"/>
    <g clip-path="url(#body-clip)" fill="none" stroke-linecap="round">
      <path d="M224 627c2 77 23 155 63 233m10-251c6 81 33 164 78 251m8-243c14 76 45 151 91 224m-4-207c20 61 49 118 88 172" stroke="#f5d083" stroke-width="13"/>
      <path d="M178 690c70 29 135 28 195-3 67-35 134-30 200 14m-405 58c78 33 149 32 215-4 73-40 145-29 216 31m-400 40c69 21 135 15 197-17 58-30 114-27 169 9" stroke="#f7d9a0" stroke-width="9"/>
      <path d="M548 617c22 73 51 139 89 199" stroke="#8d4b5d" stroke-width="27"/>
    </g>
    <path d="M280 731c35-38 77-40 122-5-19 58-61 87-117 73-18-20-20-43-5-68z" fill="#f3bd75" stroke="#594d5d" stroke-linejoin="round" stroke-width="8"/>
    <path d="M329 724c-8 22-8 44 1 68" fill="none" stroke="#fff0be" stroke-linecap="round" stroke-width="7"/>
    <circle cx="207" cy="705" r="23" fill="#f1d28e" stroke="#594d5d" stroke-width="7"/>
    <circle cx="208" cy="706" r="13" fill="url(#eye)"/>
    <circle cx="202" cy="699" r="4.5" fill="#fff"/>
    <path d="M146 756c15 7 29 6 43-2" fill="none" stroke="#594d5d" stroke-linecap="round" stroke-width="7"/>
    <path d="M435 870c37 43 80 54 124 31-25-19-42-46-50-80-24 26-49 42-74 49z" fill="url(#fin)" stroke="#594d5d" stroke-linejoin="round" stroke-width="8"/>
    <path d="M390 871c16 48 35 80 57 98" fill="none" stroke="#594d5d" stroke-linecap="round" stroke-width="8"/>
  </g>
</svg>
