<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" viewBox="0 0 900 1600">
  <title>Endler's livebearer and bubbles aquarium background</title>
  <desc>A transparent vector aquarium layer showing one small male Endler's livebearer with a slender body, compact fan tail, bold orange, green, turquoise, and black markings, crisp dark outlines, and rising bubbles.</desc>
  <defs>
    <linearGradient id="body" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#dce5a5"/>
      <stop offset=".33" stop-color="#77c7a2"/>
      <stop offset=".68" stop-color="#3b9e9c"/>
      <stop offset="1" stop-color="#376b80"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#efcf64"/>
      <stop offset=".43" stop-color="#ef8a4e"/>
      <stop offset=".76" stop-color="#cb5e58"/>
      <stop offset="1" stop-color="#5f586b"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" x2="1">
      <stop stop-color="#79c6a4"/>
      <stop offset=".45" stop-color="#edc968"/>
      <stop offset="1" stop-color="#e56f51"/>
    </linearGradient>
    <radialGradient id="eye" cx="35%" cy="28%" r="70%">
      <stop stop-color="#647b76"/>
      <stop offset=".55" stop-color="#263e42"/>
      <stop offset="1" stop-color="#13282e"/>
    </radialGradient>
    <radialGradient id="bubble" cx="35%" cy="28%" r="70%">
      <stop stop-color="#fff" stop-opacity=".94"/>
      <stop offset=".28" stop-color="#c7efeb" stop-opacity=".6"/>
      <stop offset="1" stop-color="#69aaa9" stop-opacity=".14"/>
    </radialGradient>
    <clipPath id="body-clip">
      <path d="M194 737c33-58 110-86 207-72 82 12 149 47 199 101-47 54-116 84-206 86-93 2-167-23-207-69-13-15-11-31 7-46z"/>
    </clipPath>
    <clipPath id="tail-clip">
      <path d="M578 696c73-55 143-67 210-36-25 48-24 98 2 149-64 39-134 31-211-23 24-29 24-60-1-90z"/>
    </clipPath>
    <g id="bubble-mark">
      <circle cx="50" cy="50" r="38" fill="url(#bubble)" stroke="#6eaaa8" stroke-opacity=".72" stroke-width="6"/>
      <path d="M29 43c3-10 10-17 20-20" fill="none" stroke="#fff" stroke-linecap="round" stroke-opacity=".82" stroke-width="7"/>
    </g>
  </defs>
  <g aria-label="bubbles">
    <use href="#bubble-mark" opacity=".86" transform="matrix(.4 0 0 .4 103 1160)"/>
    <use href="#bubble-mark" opacity=".64" transform="matrix(.22 0 0 .22 157 1022)"/>
    <use href="#bubble-mark" opacity=".79" transform="matrix(.32 0 0 .32 112 892)"/>
    <use href="#bubble-mark" opacity=".59" transform="matrix(.17 0 0 .17 170 762)"/>
    <use href="#bubble-mark" opacity=".73" transform="matrix(.26 0 0 .26 132 640)"/>
    <use href="#bubble-mark" opacity=".84" transform="matrix(.36 0 0 .36 709 896)"/>
    <use href="#bubble-mark" opacity=".64" transform="matrix(.21 0 0 .21 756 752)"/>
    <use href="#bubble-mark" opacity=".77" transform="matrix(.3 0 0 .3 720 617)"/>
    <use href="#bubble-mark" opacity=".58" transform="matrix(.17 0 0 .17 773 482)"/>
    <use href="#bubble-mark" opacity=".7" transform="matrix(.25 0 0 .25 737 358)"/>
  </g>
  <g aria-label="male Endler's livebearer">
    <path d="M578 696c73-55 143-67 210-36-25 48-24 98 2 149-64 39-134 31-211-23 24-29 24-60-1-90z" fill="url(#tail)" stroke="#4a5262" stroke-linejoin="round" stroke-width="10"/>
    <g clip-path="url(#tail-clip)" fill="none" stroke-linecap="round">
