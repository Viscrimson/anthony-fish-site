<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" viewBox="0 0 900 1600">
  <title>Sailfin molly and bubbles aquarium background</title>
  <desc>A transparent vector aquarium layer showing one male sailfin molly with a very tall patterned dorsal sail, silver-blue spotted body, crisp dark outlines, and rising bubbles.</desc>
  <defs>
    <linearGradient id="body" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#e4dfa4"/>
      <stop offset=".28" stop-color="#a9c0a0"/>
      <stop offset=".62" stop-color="#6b9d96"/>
      <stop offset="1" stop-color="#436e78"/>
    </linearGradient>
    <linearGradient id="sail" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#e9d78a"/>
      <stop offset=".42" stop-color="#9dad86"/>
      <stop offset=".75" stop-color="#5c8982"/>
      <stop offset="1" stop-color="#456875"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#d9d493"/>
      <stop offset=".55" stop-color="#7da18e"/>
      <stop offset="1" stop-color="#456d74"/>
    </linearGradient>
    <radialGradient id="eye" cx="35%" cy="28%" r="70%">
      <stop stop-color="#d8ca80"/>
      <stop offset=".45" stop-color="#596c61"/>
      <stop offset="1" stop-color="#13282e"/>
    </radialGradient>
    <radialGradient id="bubble" cx="35%" cy="28%" r="70%">
      <stop stop-color="#fff" stop-opacity=".94"/>
      <stop offset=".28" stop-color="#c7efeb" stop-opacity=".6"/>
      <stop offset="1" stop-color="#69aaa9" stop-opacity=".14"/>
    </radialGradient>
    <clipPath id="body-clip">
      <path d="M142 704c42-98 152-146 303-118 123 23 214 84 270 171-52 92-156 140-297 141-141 2-246-42-291-119-13-23-7-53 15-75z"/>
    </clipPath>
    <clipPath id="sail-clip">
      <path d="M286 608c44-146 139-243 272-256 66-7 123 4 172 33-39 62-54 138-45 227-134-29-267-31-399-4z"/>
    </clipPath>
    <clipPath id="tail-clip">
      <path d="M686 682c72-56 140-66 205-29-29 52-30 106-3 162-60 44-126 36-201-17 27-38 27-76-1-116z"/>
    </clipPath>
    <g id="bubble-mark">
      <circle cx="50" cy="50" r="38" fill="url(#bubble)" stroke="#6eaaa8" stroke-opacity=".72" stroke-width="6"/>
      <path d="M29 43c3-10 10-17 20-20" fill="none" stroke="#fff" stroke-linecap="round" stroke-opacity=".82" stroke-width="7"/>
    </g>
  </defs>
  <g aria-label="bubbles">
