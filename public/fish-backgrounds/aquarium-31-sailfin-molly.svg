        <circle cx="277" cy="681" r="11"/><circle cx="346" cy="705" r="10"/><circle cx="420" cy="680" r="12"/>
        <circle cx="491" cy="716" r="10"/><circle cx="558" cy="693" r="11"/><circle cx="620" cy="739" r="10"/>
        <circle cx="304" cy="789" r="9"/><circle cx="386" cy="817" r="11"/><circle cx="467" cy="786" r="10"/><circle cx="545" cy="826" r="9"/>
