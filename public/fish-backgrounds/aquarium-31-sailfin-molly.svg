    <circle cx="192" cy="678" r="4.5" fill="#fff"/>
    <path d="M129 740c16 3 31 0 45-9" fill="none" stroke="#405b5d" stroke-linecap="round" stroke-width="8"/>
    <path d="M430 892c40 46 87 56 134 30-28-20-47-49-55-87-26 30-52 49-79 57z" fill="url(#fin)" stroke="#405b5d" stroke-linejoin="round" stroke-width="8"/>
    <path d="M389 892c17 55 39 91 65 108" fill="none" stroke="#405b5d" stroke-linecap="round" stroke-width="8"/>
